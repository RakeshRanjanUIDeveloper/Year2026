<body>
    <h3>A Higher-Order Function (HOF) is a function that does at least one of these:
        <ul>
            <li>Takes another function as an argument</li>
            <li>Returns another function as its result</li>
        </ul>
    </h3>
    <h3>A function that works with other functions is called a Higher-Order Function.</h3>
</body>
