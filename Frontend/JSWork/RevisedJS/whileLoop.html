<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let salary = 10000;
      let yearlyIncrement = 20;
      let carAmount = 2500000;

      function monthsToBuyCar(salary, yearlyIncrement, carAmount) {
        let months = 0;
        let sum = 0;
        let baseSalary = salary * 12;
        while (sum < carAmount) {
          sum = sum + salary;
          months++;
          if (months % 12 === 0) {
            baseSalary = baseSalary + baseSalary * (yearlyIncrement / 100);
            salary = baseSalary / 12;
          }
        }
        let years = Math.floor(months / 12);
        let remainingMonths = months % 12;
        return { years, remainingMonths };
      }
      let result = monthsToBuyCar(salary, yearlyIncrement, carAmount);
      console.log(
        `It took me ${result.years} years and ${result.remainingMonths} months would take to buy the car`,
      );
    </script>
  </body>
</html>
