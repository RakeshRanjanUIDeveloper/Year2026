    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Outfit", sans-serif;
        }

        .users-container {
            display: flex;
            /* Enable flexbox */
            flex-wrap: wrap;
            /* Allows cards to wrap to the next line if there's not enough space */
            justify-content: center;
            /* Centers the cards horizontally */
            gap: 16px;
            /* Adds space between cards */
        }

        .card {
            display: flex;
            align-items: center;
            flex-direction: column;
            gap: 8px;
            width: 250px;
            /* Set a fixed width for the cards */
            border-radius: 16px;
            overflow: hidden;
            cursor: default;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            position: relative;
            transform: 0.3s all ease-in-out;
            margin: 16px;
            /* Add margin around the cards */
        }

        .card img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid white;
        }

        .card .profile-container {
            background-color: #9dbdff;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 40px;
            transition: 0.3s all ease-in-out;
        }

        .card .profile-info {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 0px 16px;
        }

        .card .profile-info h1 {
            font-size: 1.6rem;
            color: rgba(0, 0, 0, 0.7);
        }

        .card .profile-info .job-title {
            color: rgba(0, 0, 0, 0.5);
            font-weight: 700;
        }

        .card .profile-info .desc {
            color: rgba(0, 0, 0, 0.9);
            font-size: 0.9rem;
            max-width: 300px;
            margin-top: 8px;
        }

        .card .profile-social {
            display: flex;
            gap: 8px;
        }

        .card .profile-social a {
            color: #7695ff;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .card .profile-social a:hover {
            text-decoration: underline;
        }

        .card-bottom {
            width: 100%;
            background-color: #ff9874;
            height: 5px;
            transition: 0.3s all ease-in-out;
        }

        .card:hover .card-bottom {
            background-color: #ff6b6b;
        }

        .card:hover .profile-container {
            background-color: #7695ff;
        }

        .search-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 8px 16px;
            width: 100%;
            max-width: 400px;
        }

        .search-container input {
            border: none;
            outline: none;
            padding: 10px 20px;
            font-size: 1rem;
            width: 80%;
            border-radius: 50px;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .search-container input:focus {
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.3);
            background-color: #f0f4f8;
        }

        .search-container button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: 8px;
        }

        .search-container button:hover {
            background-color: #45a049;
        }

        .search-container button:active {
            transform: scale(0.98);
        }

        .search-container input::placeholder {
            color: #aaa;
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="search-container">
            <input type="search" placeholder="Search your name..." id="searchInput">
            <!-- <button type="submit" onclick="searchuser()">Search</button> -->
        </div>
        <div class="users-container">
        </div>
    </div>
    <script>
        const userContainer = document.querySelector('.users-container');
        const userNames = ['rakeshranjanuideveloper', 'adhikareeprayush', 'akshaymarch7', 'john-smilga', 'bradtraversy', 'acdlite',];
        const API_LINK = 'https://api.github.com/users/';

        const searchInput = document.getElementById('searchInput');
        let allUsers = [];

        const createUserCard = (json) => {
            const userCard = document.createElement('div');
            userCard.classList.add('card');
            userCard.innerHTML = `
                        <div class="profile-container">
                            <img src=${json.avatar_url}>
                        </div>
                        <div class="profile-info">
                            <h1>${json.name}</h1>
                            <p class="job-title">${json.company}</p>
                            <p class="desc">${json.bio.slice(0, 26)}</p>
                        </div>
                        <div class="profile-social">
                            <a href="${json.organizations_url}">Organization</a>
                            <a href="${json.url}">GitHub</a>
                            <a href="${json.repos_url}">Repos</a>
                        </div>
                        <div class="card-bottom"></div>
                    `;
            return userCard;
        }
        const fetchUserData = async () => {
            userContainer.innerHTML = '';
            for (const userName of userNames) {
                try {
                    const data = await fetch(`${API_LINK}${userName}`)
                    const json = await data.json();
                    console.log(json);
                    allUsers.push(json);
                    const userCard = createUserCard(json)
                    userContainer.appendChild(userCard)
                } catch (error) {
                    console.log(error);
                }
            }
        }
        fetchUserData();

        //search code
        const searchuser = () =>{
            const searchTerm = searchInput.value.toLowerCase();
            userContainer.innerHTML = '';
            if(searchTerm === ''){
                fetchUserData()
            }else{
                const filteredusers = allUsers.filter((user) =>{
                return user.name && user.name.toLowerCase().includes(searchTerm)
            })

            filteredusers.forEach((user)=>{
                const userCard = createUserCard(user)
                userContainer.appendChild(userCard)
            })
            }
        }

        searchInput.addEventListener('input', searchuser);

    </script>
