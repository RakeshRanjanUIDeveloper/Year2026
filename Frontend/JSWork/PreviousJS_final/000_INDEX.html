<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Interview Prep — Index</title>
  <style>
    :root{
      --bg:#0d1117;--surface:#161b22;--border:#30363d;
      --text:#c9d1d9;--muted:#8b949e;--accent:#58a6ff;--accent2:#79c0ff;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

    header{background:var(--surface);border-bottom:1px solid var(--border);
            padding:18px 28px;display:flex;align-items:center;
            justify-content:space-between;flex-wrap:wrap;gap:12px;
            position:sticky;top:0;z-index:100}
    .logo{font-size:1.25em;font-weight:700;color:var(--accent)}
    .logo span{color:var(--muted);font-weight:400;font-size:.75em;margin-left:8px}
    .hstats{display:flex;gap:28px}
    .hstat .n{font-size:1.35em;font-weight:700;color:var(--accent)}
    .hstat .l{font-size:.7em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

    .layout{display:flex;min-height:calc(100vh - 65px)}

    aside{width:240px;min-width:240px;background:var(--surface);
           border-right:1px solid var(--border);padding:14px 12px;
           position:sticky;top:65px;height:calc(100vh - 65px);overflow-y:auto}
    aside h3{font-size:.68em;text-transform:uppercase;letter-spacing:.1em;
              color:var(--muted);margin:16px 0 6px}
    aside h3:first-child{margin-top:0}

    .search-box{width:100%;background:var(--bg);border:1px solid var(--border);
                 border-radius:6px;padding:8px 10px;color:var(--text);
                 font-size:.86em;outline:none;margin-bottom:10px}
    .search-box:focus{border-color:var(--accent)}

    .week-btn{display:flex;align-items:center;gap:8px;width:100%;background:none;
               border:none;color:var(--muted);padding:7px 8px;border-radius:6px;
               cursor:pointer;font-size:.82em;text-align:left;
               transition:all .15s;margin-bottom:2px}
    .week-btn:hover{background:var(--border);color:var(--text)}
    .week-btn.active{background:var(--accent)18;color:var(--accent);font-weight:600}
    .week-btn .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
    .week-btn .cnt{margin-left:auto;background:var(--border);border-radius:10px;
                    padding:1px 7px;font-size:.75em;color:var(--muted)}

    main{flex:1;padding:18px 22px;overflow-y:auto}
    .result-info{font-size:.8em;color:var(--muted);margin-bottom:14px}

    .week-banner{border-radius:10px;padding:16px 20px;margin-bottom:20px;
                  border:1px solid;display:flex;align-items:flex-start;gap:16px}
    .wb-num{font-size:1.8em;font-weight:800;line-height:1}
    .wb-range{font-size:.76em;opacity:.65;margin-top:3px}
    .wb-desc{font-size:.88em;margin-top:4px;opacity:.9}
    .wb-tip{font-size:.75em;opacity:.6;margin-top:6px;font-style:italic}

    .chapter{margin-bottom:22px}
    .chapter-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;
                     padding-bottom:7px;border-bottom:1px solid var(--border);
                     cursor:pointer;user-select:none}
    .chapter-title{font-size:.95em;font-weight:600;color:var(--accent2)}
    .chapter-count{font-size:.72em;color:var(--muted);background:var(--border);
                    padding:1px 8px;border-radius:10px}
    .chapter-toggle{color:var(--muted);font-size:.75em;
                     transition:transform .2s;margin-left:auto}
    .chapter.collapsed .chapter-toggle{transform:rotate(-90deg)}
    .chapter.collapsed .cards{display:none}

    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;
           padding:13px 15px;cursor:pointer;transition:all .15s;display:block}
    .card:hover{border-color:var(--accent);transform:translateY(-1px);
                 box-shadow:0 4px 14px #0005}
    .card-num{font-size:.68em;color:var(--muted);margin-bottom:4px;font-family:monospace}
    .card-title{font-size:.88em;color:var(--text);font-weight:500;line-height:1.35}

    .empty{text-align:center;padding:60px 20px;color:var(--muted)}
    .empty .icon{font-size:2.5em;margin-bottom:10px}
    .hidden{display:none!important}

    @media(max-width:680px){
      aside{display:none}
      .cards{grid-template-columns:1fr}
    }
  </style>
</head>
<body>

<header>
  <div class="logo">⚡ JS Interview Prep <span>Complete Study Guide</span></div>
  <div class="hstats">
    <div class="hstat"><div class="n">377</div><div class="l">Total Files</div></div>
    <div class="hstat"><div class="n" id="s-shown">377</div><div class="l">Showing</div></div>
  </div>
</header>

<div class="layout">
<aside>

  <h3>Study Plan</h3>

</aside>

<main>

</main>

const CHAPTERS = [["\ud83d\udd27 JS Fundamentals", 1, 10], ["\ud83d\udd01 Loops", 11, 26], ["\u2699\ufe0f Functions", 27, 41], ["\ud83e\ude9d Hoisting & Scope", 42, 47], ["\ud83d\udd24 Strings", 48, 53], ["\ud83d\udce6 Arrays", 54, 67], ["\ud83e\udde9 Objects & Prototypes", 68, 88], ["\ud83d\udd13 Destructuring & Spread", 89, 97], ["\u2728 ES6+ Features", 98, 105], ["\ud83d\uddfa\ufe0f Map / Filter / Reduce", 106, 120], ["\ud83d\udd12 Closures", 121, 129], ["\ud83d\udccc this / Call / Apply / Bind", 130, 147], ["\ud83c\udf5b Currying", 148, 153], ["\ud83d\udee0\ufe0f Polyfills", 154, 156], ["\u267b\ufe0f Recursion", 157, 162], ["\u23f3 Async JavaScript", 163, 173], ["\ud83e\udd1d Promises", 174, 191], ["\ud83d\ude80 Async / Await", 192, 197], ["\ud83c\udf10 Fetch & API", 198, 200], ["\u274c Error Handling", 201, 203], ["\ud83d\uddb1\ufe0f Events & DOM", 204, 213], ["\u26a1 Debounce & Throttle", 214, 220], ["\ud83c\udfd7\ufe0f Design Patterns", 221, 226], ["\ud83d\udd21 String Problems", 227, 241], ["\ud83d\udd22 Array Problems", 242, 268], ["\ud83e\udde0 Output / Tricky Questions", 269, 284], ["\ud83d\udcbc Company Interview Sets", 285, 291], ["\ud83c\udfa8 UI / DOM Projects", 292, 305], ["\ud83c\udfc6 Full App Projects", 306, 313], ["\ud83d\udcda Advanced Topics", 314, 332], ["\ud83d\udfe2 Easy Challenges", 333, 335], ["\ud83d\udfe1 Medium Challenges", 336, 361], ["\ud83d\udd34 Hard Challenges", 362, 368], ["\ud83d\udcd2 Reference Notes", 0, 0]];
const WEEKS    = [["Week 1", "JS Fundamentals, Loops, Functions, Hoisting & Scope", 1, 47, "#388bfd"], ["Week 2", "Strings, Arrays, Objects & Prototypes, Destructuring, ES6+, Map/Filter/Reduce", 48, 120, "#3fb950"], ["Week 3", "Closures, this/Call/Apply/Bind, Currying, Polyfills, Recursion", 121, 162, "#d29922"], ["Week 4", "Async JS, Promises, Async/Await, Fetch, Error Handling", 163, 203, "#f78166"], ["Week 5", "Events & DOM, Debounce/Throttle, Design Patterns, Advanced Topics, Projects", 204, 332, "#bc8cff"], ["Week 6", "All Interview Challenges \u2014 Easy \u2192 Medium \u2192 Hard", 333, 368, "#f85149"]];
const TOTAL    = 377;

let activeWeek  = null;
let searchQuery = '';

function init() {
  buildWeekButtons();
  applyFilters();
}

function buildWeekButtons() {
  const el = document.getElementById('weekFilters');
  el.innerHTML = `<button class="week-btn active" data-week="all" onclick="setWeek(this)">
    <span class="dot" style="background:var(--accent)"></span>All Weeks
    <span class="cnt">${TOTAL}</span></button>`;

  WEEKS.forEach(([label, desc, start, end, color]) => {
    const cnt = FILES.filter(f => f.num >= start && f.num <= end).length;
    el.innerHTML += `<button class="week-btn" data-week="${label}"
      onclick="setWeek(this,'${label}',${start},${end},'${color}','${desc}')">
      <span class="dot" style="background:${color}"></span>${label}
      <span class="cnt">${cnt}</span></button>`;
  });
}

function setWeek(btn, label, start, end, color, desc) {
  document.querySelectorAll('.week-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeWeek = label ? {label, start, end, color, desc} : null;
  applyFilters();
}

function applyFilters() {
  searchQuery = document.getElementById('searchBox').value.toLowerCase().trim();

  const visible = FILES.filter(f => {
    if (activeWeek && (f.num < activeWeek.start || f.num > activeWeek.end)) return false;
    if (searchQuery && !f.title.toLowerCase().includes(searchQuery) &&
        !f.file.toLowerCase().includes(searchQuery)) return false;
    return true;
  });

  const banner = document.getElementById('weekBanner');
  if (activeWeek) {
    banner.className = 'week-banner';
    banner.style.cssText = `background:${activeWeek.color}12;border-color:${activeWeek.color}44;color:${activeWeek.color}`;
    banner.innerHTML = `
      <div>
        <div class="wb-num">${activeWeek.label}</div>
        <div class="wb-range">Files ${String(activeWeek.start).padStart(3,'0')} — ${String(activeWeek.end).padStart(3,'0')}</div>
      </div>
      <div>
        <div class="wb-desc">${activeWeek.desc}</div>
        <div class="wb-tip">✦ Open each file, read the concept, then write the code yourself before checking the solution.</div>
      </div>`;
  } else {
    banner.className = 'week-banner hidden';
  }

  renderChapters(visible);
  document.getElementById('s-shown').textContent = visible.length;
  document.getElementById('resultInfo').textContent =
    visible.length === TOTAL
      ? `Showing all ${TOTAL} files`
      : `Showing ${visible.length} of ${TOTAL} files`;
  document.getElementById('emptyState').classList.toggle('hidden', visible.length > 0);
}

function renderChapters(visible) {
  const container = document.getElementById('chaptersContainer');
  container.innerHTML = '';
  CHAPTERS.forEach(([name, start, end]) => {
    const chFiles = (start === 0 && end === 0)
      ? visible.filter(f => f.num === 0)
      : visible.filter(f => f.num >= start && f.num <= end);
    if (!chFiles.length) return;

    const div = document.createElement('div');
    div.className = 'chapter';
    div.innerHTML = `
      <div class="chapter-header" onclick="this.parentElement.classList.toggle('collapsed')">
        <span class="chapter-title">${name}</span>
        <span class="chapter-count">${chFiles.length}</span>
        <span class="chapter-toggle">▾</span>
      </div>
      <div class="cards">${chFiles.map(cardHTML).join('')}</div>`;
    container.appendChild(div);
  });
}

function cardHTML(f) {
  return `<div class="card" onclick="window.open('${f.file}','_blank')">
    <div class="card-num">#${String(f.num).padStart(3,'0')}</div>
    <div class="card-title">${f.title}</div>
  </div>`;
}

</script>
