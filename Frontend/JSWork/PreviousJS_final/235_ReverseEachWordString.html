<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Each Word In String</title>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
        h1 { color: #569cd6; font-size: 1.2em; margin-bottom: 10px; }
        pre { background: #252526; padding: 16px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; }
        #output { background: #252526; padding: 16px; border-radius: 6px; margin-top: 16px; min-height: 40px; }
        #output::before { content: '// Output'; color: #608b4e; display: block; margin-bottom: 8px; }
    </style>
</head>
<body>
    <h1>Reverse Each Word In String</h1>
    <pre><code>const name='Welcome to this javascript interview.';
 let output=name.split(" ").map(ele=&gt;ele.split('').reverse().join('')).join(" ");
 console.log(output);
 
 //"emocleW ot siht tpircsavaj .weivretni"</code></pre>
    <div id="output"></div>
    <script>
        // Capture console.log output and display on page
        const outputDiv = document.getElementById('output');
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            const line = document.createElement('div');
            line.textContent = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ');
            outputDiv.appendChild(line);
        };
    </script>
    <script>
const name='Welcome to this javascript interview.';
 let output=name.split(" ").map(ele=>ele.split('').reverse().join('')).join(" ");
 console.log(output);
 
 //"emocleW ot siht tpircsavaj .weivretni"
    </script>
</body>
</html>
